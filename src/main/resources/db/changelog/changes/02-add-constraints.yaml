databaseChangeLog:
  - changeSet:
      id: 2
      author: denis
      changes:
        # Вимога: Унікальне ім'я продукту всередині категорії (+1 бал)
        - addUniqueConstraint:
            tableName: products
            columnNames: name, category_id
            constraintName: uq_product_name_per_category

        # Індекс для прискорення пошуку по імені продукту
        - createIndex:
            tableName: products
            indexName: idx_product_name
            columns:
              - column:
                  name: name

        # Індекс для пошуку замовлень по email
        - createIndex:
            tableName: orders
            indexName: idx_order_email
            columns:
              - column:
                  name: customer_email